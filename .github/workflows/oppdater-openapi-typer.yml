name: Oppdater openapi-typer

# Trigges av aap-behandlingsflyt sin "Generer openapi schema"-workflow når openapi.json
# endrer seg på main. Laster ned openapi.json-artifaktet og kjører yarn gentypes mot
# den filen (i stedet for mot en lokalt kjørende backend), og oppretter en PR dersom
# de genererte typene har endret seg.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Run ID for workflow-kjøringen i aap-behandlingsflyt som produserte openapi.json'
        required: true
        type: string

jobs:
  oppdater-typer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      SKIP_YARN_COREPACK_CHECK: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: navikt/github-app-token-generator@b96ff604b2300989cd1105e3fad09199fca56681 # v1.2.1
        id: get-behandlingsflyt-token
        with:
          app-id: '${{ secrets.TEAM_AAP_GITHUB_APP_ID }}'
          private-key: '${{ secrets.TEAM_AAP_GITHUB_APP_PRIVATE_KEY }}'
          repo: navikt/aap-behandlingsflyt

      - name: Last ned openapi.json fra aap-behandlingsflyt
        run: gh run download "${{ inputs.run-id }}" --repo navikt/aap-behandlingsflyt --name openapi --dir .
        env:
          GH_TOKEN: ${{ steps.get-behandlingsflyt-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generer typer fra openapi.json
        run: yarn gentypes:ci

      - name: Rydd opp midlertidig fil
        run: rm -f openapi.json

      - name: Opprett eller oppdater PR med oppdaterte typer
        run: |
          if git diff --quiet -- lib/types/schema.d.ts; then
            echo "Ingen endringer i genererte typer, avslutter."
            exit 0
          fi

          git config --global user.email "aap-openapi-typer-updater@nav.no"
          git config --global user.name "AAP openapi-typer sync"

          BRANCH_NAME="chore/oppdater-openapi-typer"
          git checkout -B "$BRANCH_NAME"
          git add lib/types/schema.d.ts
          git commit -m "AAP-BAU oppdater genererte typer fra aap-behandlingsflyt openapi.json"
          git push --force origin HEAD:"$BRANCH_NAME"

          EXISTING_PR=$(gh pr list --state open --head "$BRANCH_NAME" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Oppdaterer eksisterende PR #$EXISTING_PR"
            gh pr comment "$EXISTING_PR" --edit-last --create-if-none --body "Oppdatert med nye typer fra run ${{ inputs.run-id }}."
          else
            gh pr create --head "$BRANCH_NAME" \
              --title "AAP-BAU: Oppdater genererte typer fra aap-behandlingsflyt" \
              --body "Automatisk generert PR. openapi.json har endret seg i navikt/aap-behandlingsflyt (run ${{ inputs.run-id }}), og \`lib/types/schema.d.ts\` er regenerert med \`yarn gentypes:ci\`."
          fi
        env:
          GH_TOKEN: ${{ secrets.github_token }}

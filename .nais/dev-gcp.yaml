apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50M'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '90'
  name: saksbehandling
  namespace: aap
  labels:
    team: aap
    systemkatalog.nav.no/system: SK-268
spec:
  image: {{image}}
  ingresses:
    - https://kelvin.ansatt.dev.nav.no
    - https://kelvin.intern.dev.nav.no
  port: 3000
  liveness:
    path: /actuator/live
    initialDelay: 20
    timeout: 60
  readiness:
    path: /actuator/ready
    initialDelay: 20
    timeout: 60
  prometheus:
    enabled: true
    path: /actuator/metrics
  replicas:
    min: 2
    max: 4
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 512Mi
  azure:
    application:
      enabled: true
      allowAllUsers: false
      claims:
        groups:
          # 0000-GA-AAP_BESLUTTER
          - id: f0f6cad5-e3c0-4308-99a2-3630ac60174a
          # 0000-GA-AAP_LES
          - id: 96e18023-db50-45f7-b023-3251279df28d
          # 0000-GA-AAP_SAKSBEHANDLER_OPPFOLGING
          - id: 33e00155-169b-41e5-8a3f-5582ed975a15
          # 0000-GA-AAP_KVALITETSSIKRER
          - id: c3e18aef-a7ac-49df-806e-4fe58b81460d
          # 0000-GA-AAP_SAKSBEHANDLER_NASJONAL
          - id: 3377dc51-ca61-4e36-b812-21b5fc34474f
          # 0000-GA-AAP_DRIFT
          - id: bc89623f-4624-4978-ac54-acd048c0f2a5
          # 0000-GA-AAP_PRODUKSJONSSTYRING
          - id: c75883f9-4cb2-42c7-b75c-3f0f29ee3ead
    sidecar:
      enabled: true
      autoLogin: true
  frontend:
    generatedConfig:
      mountPath: /tmp/nais.js
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: elastic
        - id: loki
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  envFrom:
    - secret: kelvin-unleash-api-token
  accessPolicy:
    outbound:
      rules:
        - application: behandlingsflyt
        - application: oppgave
        - application: postmottak-backend
        - application: statistikk
        - application: saksbehandling-pdfgen
        - application: dokumentinnhenting
        - application: tilgang
        - application: api-intern
        - application: endringslogg
          namespace: k9saksbehandling
      external:
        - host: cdn.nav.no
        - host: aap-unleash-api.nav.cloud.nais.io
        - host: arbeid-og-inntekt-q2.dev-fss-pub.nais.io
        - host: reops-event-proxy.ekstern.dev.nav.no
